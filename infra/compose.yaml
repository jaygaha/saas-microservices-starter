# infra/compose.yaml
#
# Run from the repo root via the Makefile:  make up
# (which expands to: docker compose -f infra/compose.yaml --env-file .env --profile core up -d --build)
#
# NOTE on paths: Compose resolves relative paths against THIS file's directory (infra/).
# That's why service build contexts are "../auth-service" (repo root)
# while Traefik's config is "./gateway/..." (infra/gateway/...).

networks:
  # Single flat network for the whole stack. Every container that needs to talk
  # to another sits here. (In a later hardening step we can split this into an
  # "edge" net for Traefik<->services and a "backend" net that isolates the DB.)
  saas-net:
    driver: bridge

services:
  # Reverse Proxy / API Gateway
  traefik:
    image: traefik:v3.7
    container_name: saas_gateway
    profiles: ["core"]
    restart: unless-stopped
    ports:
      # host:container. Container always listens on :80 internally; the public
      # host port is whatever TRAEFIK_HTTP_PORT is set to in .env (8020).
      - "${TRAEFIK_HTTP_PORT}:80"
      # Dashboard: container serves it on :8080, exposed on TRAEFIK_DASHBOARD_PORT.
      - "${TRAEFIK_DASHBOARD_PORT}:8080"
    volumes:
      # Read the Docker API to auto-discover services from their labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Static config (loaded once at boot).
      - ./gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      # Dynamic config (hot-reloaded; reserved for later steps).
      - ./gateway/dynamic:/etc/traefik/dynamic:ro
    networks:
      - saas-net

  # Shared Database
  postgres:
    image: postgres:18.4-alpine
    container_name: saas_database
    profiles: ["core", "migrate"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - saas-net
    healthcheck:
      # Use the real configured user/db, not the hardcoded "postgres".
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Shared Cache
  redis:
    image: redis:8.8.0-alpine
    container_name: saas_cache
    profiles: ["core"]
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      # Exposed so the healthcheck below can authenticate.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - saas-net
    healthcheck:
      # Authenticated PING -> must actually return PONG (the old unauthenticated
      # "redis-cli ping" reported healthy even when auth was misconfigured).
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth service (Go): users, auth, JWT, teams, RBAC
  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: saas_auth
    profiles: ["core"]
    restart: unless-stopped
    environment:
      SERVICE_NAME: auth-service
      PORT: ${AUTH_SERVICE_PORT}
      # Wired now so later steps just consume them (unused in Step 1).
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.routers.auth.middlewares=auth-stripprefix"
      - "traefik.http.middlewares.auth-stripprefix.stripprefix.prefixes=/api/auth"
      - "traefik.http.services.auth.loadbalancer.server.port=${AUTH_SERVICE_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${AUTH_SERVICE_PORT}/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - saas-net

  # Task service (Python / FastAPI): boards, tasks
  task-service:
    build:
      context: ../task-service
      dockerfile: Dockerfile
    container_name: saas_task
    profiles: ["core"]
    restart: unless-stopped
    environment:
      SERVICE_NAME: task-service
      PORT: ${TASK_SERVICE_PORT}
      # Note: Python drivers use the postgresql:// scheme.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
        - "traefik.enable=true"
        - "traefik.http.routers.task.rule=PathPrefix(`/api/tasks`)"
        - "traefik.http.routers.task.entrypoints=web"
        - "traefik.http.routers.task.middlewares=task-stripprefix"
        - "traefik.http.middlewares.task-stripprefix.stripprefix.prefixes=/api/tasks"
        - "traefik.http.services.task.loadbalancer.server.port=${TASK_SERVICE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${TASK_SERVICE_PORT}/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - saas-net

  # One-shot schema migrations (golang-migrate). Runs ONLY when invoked via `make migrate*`
  # it's in its own profile, so `make up` never triggers it.
  migrate:
    image: migrate/migrate:v4.19.1
    profiles: ["migrate"]
    container_name: saas_db_migrate
    volumes:
      - ./database/migrations:/migrations:ro
    # Fixed part of every command; the subcommand (up/down/…) is appended by make.
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saas-net

volumes:
  postgres_data:
  redis_data:
