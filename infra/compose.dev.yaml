# Dev override: run the frontend as a Vite dev server (HMR) instead of nginx.
#   make up-dev   → app at http://localhost:3000 (HMR); /api proxied to the traefik gateway

services:
  # FRONTEND (Vite dev server with proxy for the gateway)
  web-service:
    profiles: ["dev", "core"]
    build:
      target: dev
    environment:
      VITE_PORT: ${FRONTEND_SERVICE_PORT}
      VITE_PROXY_TARGET: "http://traefik:80"   # gateway's INTERNAL port on the docker network
      VITE_USE_POLLING: "true"
    container_name: saas_web_dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_SERVICE_PORT}:${FRONTEND_SERVICE_PORT}"
    volumes:
      - ../web-service:/www/web-service
      - /www/web-service/node_modules # host npm install doesn't bleed into container
    labels:
      - "traefik.enable=false"     # dev is accessed directly at :3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${FRONTEND_SERVICE_PORT}/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - saas-net
